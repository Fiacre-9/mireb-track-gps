<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>TrackFleet – Hors connexion</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf0f5;color:#151d2b;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  main{max-width:340px}
  .mark{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,#3b7bff,#1640b8);color:#fff}
  .mark svg{width:38px;height:38px;fill:currentColor}
  h1{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
  p{margin:0 0 6px;color:#56627a}
  a{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:12px;background:#2563eb;color:#fff;font-weight:650;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.5c-4.2 0-7.5 3.2-7.5 7.3 0 5.3 7.5 11.7 7.5 11.7s7.5-6.4 7.5-11.7c0-4.1-3.3-7.3-7.5-7.3zm0 4.3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg></div>
  <h1>Pas de connexion internet</h1>
  <p>Le suivi des véhicules a besoin du réseau. Il reprend dès que la connexion revient.</p>
  <p lang="en">You're offline. Live tracking resumes when the network is back.</p>
  <a href="/">Réessayer</a>
</main>
</body>
</html>
