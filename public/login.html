<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackFleet – Connexion</title>
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TrackFleet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="loginbody">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-pin-solid" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.5c-4.2 0-7.5 3.2-7.5 7.3 0 5.3 7.5 11.7 7.5 11.7s7.5-6.4 7.5-11.7c0-4.1-3.3-7.3-7.5-7.3zm0 4.3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 20h14"/></symbol>
</svg>
<div class="bars"><div id="netbar" class="bar off" role="status" hidden><span data-i18n="offlineBar"></span></div></div>
<form id="f" class="logincard" autocomplete="on">
  <div class="logo-lg">
    <span class="mark"><svg class="i fill" aria-hidden="true"><use href="#i-pin-solid"/></svg></span>
    <h1>TrackFleet</h1>
    <p data-i18n="tagline">Suivi GPS de flotte en temps réel</p>
  </div>
  <label><span data-i18n="email">E-mail</span><input id="email" type="email" required autocomplete="username" inputmode="email"></label>
  <label><span data-i18n="password">Mot de passe</span><input id="pw" type="password" required autocomplete="current-password"></label>
  <div id="err" class="err hidden" role="alert"></div>
  <button id="go" class="btn primary" type="submit" data-i18n="signin">Se connecter</button>
  <button id="installBtn" class="btn" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="installApp">Installer l'application</span></button>
  <select id="lang" aria-label="Language"><option value="fr">Français</option><option value="en">English</option></select>
</form>
<script src="/pwa.js"></script>
<script src="/i18n.js"></script>
<script src="/login.js"></script>
</body>
</html>
